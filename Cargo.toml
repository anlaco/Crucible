[workspace]
# resolver = "3" es el resolvedor de dependencias moderno; requiere edición 2024
resolver = "3"
# Glob: culaquier carpeta dentro de crates/ es un miembro del workspace.
# Asi no hay que tocar este fichero cada vez que añadimos un crate.
members = ["crates/*"]

# Valores que heredarán todos los crates, para no repetirlos en cada uno.
[workspace.package]
version         = "0.1.0"
edition         = "2024"
license         = "MIT OR Apache-2.0"
rust-version    = "1.90"
authors         =["anlaco <anlaco@proton.me>"]