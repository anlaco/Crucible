# Configuración de cargo-deny: la red de seguridad de la licencia del proyecto.
#
# InstruSim se publica como MIT / Apache-2.0. Cualquier dependencia con licencia
# copyleft fuerte obligaría a relicenciar el proyecto entero, así que la lista de
# licencias permitidas es explícita y todo lo demás falla la compilación en CI.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
